# webdoom CI — the tier a clone can actually run.
#
# WHY THIS FILE EXISTS AND WHAT IT DOES NOT DO
# --------------------------------------------
# README.md said "fails CI" three times and docs/engine-archaeology.md said "CI
# enforces it on every push".  There was no CI: "CI" meant a human running
# tools/run-tests.sh on the dev box.  A reader could not tell the difference,
# which is doc drift by spec.md's own tenet 6 (a promise without a gate).
#
# The honest fix is not a workflow that pretends to run everything.  Game data
# is not distributable, so a public runner has no IWADs — and without IWADs the
# marquee gates (13 sim goldens, 5 render golden families, netplay, drop-in,
# the browser suite, the ASan and freestanding legs) cannot run AT ALL.  This
# runs the --quick tier and the summary step below states plainly what it did
# not cover.
#
# The quick tier is NOT simply "every leg that needs no WAD, no build and no
# browser", which is what this comment used to say.  Two things make that false:
# `golden-provenance` declares no prerequisite at all and still sits below the
# tier gate (it reads only committed tools/golden/*.json), and `lint-c` and
# `doc-drift` do have prerequisites -- clang-format pinned to major 22, and gcc.
# On ubuntu-latest `lint-c` SKIPs (no clang-format 22) and `web-registry` SKIPs
# (no built engine).  The exact run/skip split is NOT typed here any more: it
# said "12 legs run and 1 skipped" against an 18-leg quick tier, a predicted
# number nothing computed and nobody could check from a dev box.  The runner
# prints its own totals and every SKIP carries its reason; read those.
#
# The full suite (90 legs at the time of writing -- `tools/run-tests.sh --list`
# prints the current number, and the runner now asserts its own total against
# that registry) still runs on a host with the WAD library, a built engine and
# Chrome:  bash tools/run-tests.sh --require-complete
# To have CI run it too, add a self-hosted runner with those prerequisites and
# a second job with `runs-on: self-hosted`; nothing else changes.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    name: quick tier (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor README and server/package.json's `engines` state; 26 is
        # what the dev box runs (v26.8.1), where the full local tier is green; 24
        # sits between them.  A suite that only ever runs on one Node version
        # cannot tell a code bug from a runtime change, which is what task 22.3
        # was about — so the matrix must reach BOTH ends of the supported range.
        # It previously read ['20', '24'] under a comment claiming it "brackets"
        # the dev box: 24 < 26.8.1, so the version actually being developed on
        # was the one version CI never ran.
        node: ['20', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the server dependency
        run: cd server && npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Show what this runner has
        run: |
          echo "node       $(node --version)"
          echo "gcc        $(gcc --version | head -1)"
          echo "python3    $(python3 --version)"
          echo "clang-format $(command -v clang-format >/dev/null && clang-format --version || echo '(absent)')"
          echo "IWADs      $(ls wads/lib/*.wad 2>/dev/null | wc -l) present"

      - name: Leg registry
        run: bash tools/run-tests.sh --list

      - name: Quick tier
        run: bash tools/run-tests.sh --quick

      # The runner shows only the tail of a failing leg, because gate.sh trims.
      # run-tests.sh already keeps each failing leg's FULL output at
      # tools/.suite-logs/<leg>.log and says so -- and this workflow was
      # throwing that away, so the first red it ever produced named two failed
      # checks and showed neither.  A red whose reason is trimmed off is the
      # same defect as a green with no reason.
      - name: Failing leg logs
        if: failure()
        run: |
          shopt -s nullglob
          logs=(tools/.suite-logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no leg logs kept — the failure was outside a leg"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "═══════════════════════════════════════════════════════════"
            echo "── $f"
            echo "═══════════════════════════════════════════════════════════"
            cat "$f"
          done

      - name: Keep the leg logs as an artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs-node-${{ matrix.node }}
          path: tools/.suite-logs/
          if-no-files-found: ignore

      - name: What this job did NOT run
        if: always()
        run: |
          {
            echo '## Not covered by this job'
            echo
            echo 'Game data is not distributable, so this runner has no IWADs.'
            echo 'These gates need one and did **not** run here:'
            echo
            echo '- 13 sim goldens, and 5 render golden families (65 more comparisons)'
            echo '- the wide/sim-invariance, fakeflat, potato, sbskip and diffblit toggles'
            echo '- netplay 2p/4p, drop-in, spectator, churn, mixed-width'
            echo '- the differential fuzzer and the adversarial ASan map gate'
            echo '- the freestanding and 32-bit-ARM cross-architecture legs'
            echo '- the 20 browser legs and the browser-pipeline baseline'
            echo '- three colormap verifier families inside doc-drift (it reports this itself)'
            echo '- the two build-output paths in sw-precache (/engine/doom.js, doom.wasm)'
            echo
            echo 'Legs that ran but could not check everything say so in their own'
            echo 'output, as `(INCOMPLETE)` — a pass here is never a claim of full'
            echo 'coverage.'
            echo
            echo 'Run the whole thing on a host that has them:'
            echo '```'
            echo 'bash tools/run-tests.sh --require-complete'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
