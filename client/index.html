<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A slim, modern DOOM port for the browser — vanilla-exact simulation, zero install, zero-config LAN multiplayer.">
<meta name="theme-color" content="#000000">
<title>webdoom</title>
<link rel="stylesheet" href="css/webdoom.css">
</head>
<body>
<main id="stage">
  <canvas id="screen" width="320" height="200" tabindex="0" hidden></canvas>

  <section id="landing"></section>

  <!-- The loading panel is a progress bar and says so: main.js sets
       aria-valuenow as the fill moves, and the label is its accessible name.
       Without the role it was two anonymous divs changing width. -->
  <div id="loading" hidden>
    <div id="loading-label"></div>
    <div id="loading-bar" role="progressbar" aria-labelledby="loading-label"
         aria-valuemin="0" aria-valuemax="100"><div id="loading-fill"></div></div>
  </div>

  <div id="countdown" hidden></div>
  <!-- EVERY error this app can produce is written here, and nothing announced
       it.  polite, not assertive: these are status messages, and an assertive
       region interrupts whatever a screen reader is in the middle of. -->
  <div id="overlay"><div id="status" role="status" aria-live="polite" aria-atomic="true"></div></div>
  <div id="sw-update" hidden>
    New version available — <button id="sw-reload">reload</button>
  </div>
</main>
<noscript>
  <p style="color:#c0c0c0;font:14px system-ui;padding:24px">
    webdoom needs JavaScript, WebAssembly and WebGL2. Nothing on this page works without them.
  </p>
</noscript>
<script type="module" src="js/lobby.js"></script>
</body>
</html>
